# Envoi de la notification quotidienne « devinette du jour ».
#
# C'est le déclencheur qui manquait : sans lui, les abonnements push
# s'accumulaient dans Supabase sans que rien ne leur envoie jamais rien.
#
# Deux secrets à créer dans Settings → Secrets and variables → Actions :
#   SB_SERVICE_KEY     clé service_role Supabase (la table des abonnés est
#                      illisible avec la clé publique, par choix de sécurité)
#   VAPID_PRIVATE_KEY  clé privée VAPID (voir docs/NOTIFICATIONS.md)
name: Notification devinette

on:
  schedule:
    # VISÉ : autour de midi à Paris. Mesuré, pas deviné — voir
    # scripts/heures-jeu.mjs, sur 183 parties de devinette et 14 jours :
    #
    #   envoi à …   déjà joué   joueurs présents à cette heure
    #      10 h        32 %                 1
    #      12 h        40 %                 9
    #      20 h        81 %                 7
    #
    # L'ancien envoi de 20 h arrivait APRÈS la partie pour quatre abonnés sur
    # cinq : une relance qui annonce ce qui est déjà fait apprend surtout à ne
    # plus l'ouvrir. Le matin tôt vide la case « déjà joué » mais ne trouve
    # personne — ce public joue le midi, le soir et jusqu'à 2 h du matin. Midi
    # garde 60 % de marge, rassemble le plus de monde avec 13 h, et laisse tout
    # l'après-midi et la soirée pour jouer si la notification est balayée.
    #
    # 09:00 UTC et non 10:00 : GitHub ne garantit rien sur les tâches planifiées
    # et les deux exécutions observées ont démarré 57 min après l'heure demandée
    # (17:57 pour un cron à 17:00). L'arrivée réelle est donc attendue entre 11 h
    # et 12 h à Paris en été, 10 h et 11 h en hiver — un décalage d'une heure
    # l'hiver reste préférable à deux crons, qui risqueraient d'envoyer deux fois
    # le même jour.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans rien envoyer"
        type: boolean
        default: true
      jour:
        description: "Forcer un jour (YYYY-MM-DD), vide = aujourd'hui"
        type: string
        default: ""

# Deux exécutions simultanées enverraient la notification en double.
concurrency:
  group: notif-devinette
  cancel-in-progress: false

jobs:
  envoyer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        # Le dépôt embarque Playwright : sans cette variable, npm ci
        # téléchargerait des navigateurs dont l'envoi n'a aucun besoin.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Vérifier la logique avant d'envoyer
        # Le joueur du jour est calculé ici ET dans l'app : si les deux
        # divergent, la notification décrit un autre joueur que le jeu. Ces
        # tests verrouillent l'égalité — mieux vaut ne rien envoyer que mentir.
        run: npx vitest run src/test/devinette.test.ts src/test/push.test.ts

      - name: Envoyer
        env:
          SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://goatfc.fr
        run: |
          npx tsx scripts/notif-devinette.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            ${{ inputs.jour != '' && format('--jour={0}', inputs.jour) || '' }}
