    <!-- ── ÉCRANS DE LANCEMENT DE LA PWA iOS ────────────────────────────────
         Générés par `npm run splash`, qui IMPRIME ce bloc : à recoller si sa
         liste d'appareils change.

         Une PWA ajoutée à l'écran d'accueil depuis Safari n'a pas accès au
         splash natif du paquet d'app — son seul mécanisme est celui-ci, un
         <link> par taille d'écran. Le projet n'en déclarait aucun, ce qui ne
         se voyait pas tant qu'une affiche interne de 2 500 ms tenait le rôle.
         Retirée, la PWA démarrait sur un aplat d'or nu.

         Une erreur d'UN pixel sur device-width fait échouer la media query en
         silence : l'appareil retombe sur `background_color`, déjà l'or de la
         charte, et rien ne le signale. D'où la génération par script.

         Portrait seulement : le manifeste déclare `"orientation": "portrait"`.
    -->
    <link rel="apple-touch-startup-image" href="/splash-ios/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"><!-- SE 2/3, 8 -->

    <!-- Service Worker registration : push notifs + auto-update PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        // Quand le SW actif change (= nouvelle version vient de prendre le
        // contrôle), on recharge la page une seule fois pour récupérer
        // l'index.html + assets à jour. Sans ça, les utilisateurs en mode
        // PWA installée restent bloqués sur l'ancienne version.
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").then(
            function (reg) {
              // Force la vérif d'une nouvelle version à chaque ouverture
              // (utile sur PWA mobile qui ne re-check pas spontanément).
              try { reg.update(); } catch (e) {}
              // Re-vérifie aussi quand l'app revient au premier plan
              document.addEventListener("visibilitychange", function () {
                if (document.visibilityState === "visible") {
                  try { reg.update(); } catch (e) {}
                }
              });
            },
            function (err) { console.error("SW failed:", err); }
          );
        });
      }
    </script>
